<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoリスト</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Custom styles for female-oriented design -->
    <style>
        body {
            background-color: #f0f8ff; /* AliceBlue */
        }

        .container {
            background-color: #ffffff; /* White */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
        }

        .btn-info {
            background-color: #87cefa; /* LightSkyBlue */
            border-color: #87cefa; /* LightSkyBlue */
        }

        .btn-info:hover {
            background-color: #add8e6; /* LightBlue */
            border-color: #add8e6; /* LightBlue */
        }

        .btn-danger {
            background-color: #ff6347; /* Tomato */
            border-color: #ff6347; /* Tomato */
        }

        .btn-danger:hover {
            background-color: #ff4500; /* OrangeRed */
            border-color: #ff4500; /* OrangeRed */
        }
        /* Add more styles as needed */
    </style>
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-4">ToDoリスト</h2>
        <a  class="btn btn-primary" href="{% url 'todo:add_todo' %}" role="button">追加</a>
        <ul class="list-group inputgroup mt-3">
            {% for todo in todos %}
            <li class="list-group-item input-group-text d-flex justify-content-between align-items-center">
                <div class = "btn-gloup">
                    <a class="btn btn-primary" href="{% url 'todo:edit_todo' todo.id %}"  role="button">編集</a>
                    <a  class="btn btn-primary" href="{% url 'todo:delete_todo' todo.id %}" role="button">削除</a>
                </div>
                <!-- <input class = "form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input"> -->
                    <div class = "box box-1 ">{{ todo.id }}</div>
                    <div class = "box box-2">{{ todo.title }}</div>
                    <div class = "box box-3">{{ todo.description }}</div>
                <!-- </input> -->
            </li>
            {% endfor %}
        </ul>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
